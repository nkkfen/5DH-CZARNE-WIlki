<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INF02 – Notatki Egzaminacyjne</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #2a2f45;
    --accent: #5b6af0;
    --accent2: #00d4aa;
    --accent3: #f0a05b;
    --accent4: #e05b8a;
    --text: #e2e6f3;
    --muted: #7a84a8;
    --highlight: #5b6af022;
    --tag-bg: #1e2540;
    --tag-border: #2d3660;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* === HEADER === */
  header {
    padding: 2rem 2rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0a0c12 0%, var(--bg) 100%);
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
  }

  /* === SEARCH + AUTOCOMPLETE === */
  .search-wrapper {
    position: relative;
    margin-bottom: 1.1rem;
    max-width: 640px;
  }

  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1rem;
    pointer-events: none;
    z-index: 1;
  }

  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--highlight);
  }

  #searchInput::placeholder { color: var(--muted); }

  /* Autocomplete dropdown */
  #autocomplete {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #1a1f30;
    border: 1px solid var(--accent);
    border-radius: 8px;
    overflow: hidden;
    z-index: 100;
    box-shadow: 0 8px 24px #00000066;
    display: none;
  }

  .ac-item {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    padding: 0.55rem 1rem;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    transition: background 0.1s;
  }

  .ac-item:hover, .ac-item.focused {
    background: var(--highlight);
    color: var(--accent);
  }

  .ac-item .ac-badge {
    font-size: 0.6rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    flex-shrink: 0;
  }

  .ac-item mark {
    background: transparent;
    color: var(--accent3);
    font-weight: 700;
    padding: 0;
  }

  /* === TAGS BAR === */
  .tags-section {
    margin-top: 0.5rem;
  }

  .tags-groups {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .tag-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
  }

  .tag-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    min-width: 70px;
    opacity: 0.6;
  }

  .tag-filter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 0.28rem 0.6rem;
    border-radius: 4px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    line-height: 1;
  }

  .tag-filter:hover { border-color: var(--accent); color: var(--text); }

  .tag-filter.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* Special exam tags */
  .tag-filter[data-tag="egzamin-teoretyczny"] { border-color: #3a7bd5; color: #7ab3f5; }
  .tag-filter[data-tag="egzamin-praktyczny"]  { border-color: #2ea87e; color: #5dd4ad; }
  .tag-filter[data-tag="egzamin-teoretyczny"].active { background: #3a7bd5; border-color: #3a7bd5; color: #fff; }
  .tag-filter[data-tag="egzamin-praktyczny"].active  { background: #2ea87e; border-color: #2ea87e; color: #fff; }

  .tag-filter.clear-btn {
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }

  .tag-filter.clear-btn:hover { border-color: #e05b5b; color: #e05b5b; }

  /* === LAYOUT === */
  .main { padding: 1.5rem 2rem; }

  .results-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    min-height: 1rem;
  }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }

  /* === NOTE CARD === */
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .note-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 10px 0 0 10px;
  }

  .note-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .note-card:hover::before { opacity: 1; }
  .note-card.hidden { display: none; }

  /* === RICH card (has versions/lists) === */
  .note-card.rich {
    border-color: #2a3050;
    background: #161b28;
  }

  .note-card.rich::before { background: var(--accent3); }
  .note-card.rich:hover { border-color: var(--accent3); }
  .note-card.rich:hover::before { opacity: 1; }

  .note-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }

  .note-card.rich .note-title {
    color: var(--accent3);
  }

  .note-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* === NOTE TAGS (on card) === */
  .note-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.85rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border);
  }

  .note-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    padding: 0.18rem 0.45rem;
    border-radius: 3px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .note-tag:hover { border-color: var(--accent); color: var(--accent); }

  /* Exam tags on card */
  .note-tag[data-tag="egzamin-teoretyczny"] {
    border-color: #2a4a7a;
    color: #5a9ad5;
    background: #0e1826;
  }
  .note-tag[data-tag="egzamin-praktyczny"] {
    border-color: #1a5a42;
    color: #3dbd8e;
    background: #0a1e18;
  }
  /* Protocol tag */
  .note-tag[data-tag="protokół"] {
    border-color: #4a2d6a;
    color: #b07de0;
    background: #18102a;
  }

  /* Rich-card icon badge */
  .rich-badge {
    display: inline-block;
    font-size: 0.55rem;
    font-family: 'JetBrains Mono', monospace;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    background: #f0a05b22;
    border: 1px solid #f0a05b55;
    color: var(--accent3);
    margin-left: 0.5rem;
    vertical-align: middle;
    letter-spacing: 0.05em;
  }

  /* Highlight match */
  mark {
    background: #f0a05b33;
    color: var(--accent3);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* No results */
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    display: none;
  }

  @media (max-width: 600px) {
    header { padding: 1.25rem 1rem 1rem; }
    .main { padding: 1rem; }
    h1 { font-size: 1.5rem; }
    .notes-grid { grid-template-columns: 1fr; }
    .tag-group-label { display: none; }
  }

  /* === NOTE CARD CURSOR === */
  .note-card { cursor: pointer; }

  /* === NOTE MODAL === */
  #noteModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    animation: modalBgIn 0.18s ease;
  }
  #noteModal.open { display: flex; }
  @keyframes modalBgIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.75rem 2rem;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    animation: modalCardIn 0.2s cubic-bezier(0.22,1,0.36,1);
  }
  .modal-card.rich { border-color: #2a3050; background: #161b28; }
  .modal-card.rich::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent3);
    border-radius: 14px 0 0 14px;
  }
  .modal-card:not(.rich)::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent);
    border-radius: 14px 0 0 14px;
  }
  @keyframes modalCardIn {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
    font-family: monospace;
  }
  .modal-close:hover { border-color: var(--accent4); color: var(--accent4); }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--accent2);
    margin-bottom: 1rem;
    line-height: 1.3;
    padding-right: 2.5rem;
  }
  .modal-card.rich .modal-title { color: var(--accent3); }

  .modal-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .modal-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    opacity: 0.5;
    margin-top: 1rem;
    text-align: center;
  }

  @media (max-width: 600px) {
    .modal-card { padding: 1.25rem 1.25rem; max-height: 90vh; }
    .modal-title { font-size: 1.05rem; }
    .modal-body { font-size: 0.82rem; }
  }

  /* === TAB NAV === */
  .tab-nav {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 0;
    padding: 0 2rem;
    background: #0a0c12;
  }
  .tab-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.65rem 1.3rem;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn.quiz-tab.active { color: var(--accent3); border-bottom-color: var(--accent3); }

  /* === QUIZ OVERLAY === */
  #quizView {
    display: none;
    min-height: calc(100vh - 120px);
  }
  #quizView.visible { display: block; }
  #notesView { display: block; }
  #notesView.hidden { display: none; }

  /* === QUIZ CONFIG SCREEN === */
  .quiz-config {
    max-width: 720px;
    margin: 2.5rem auto;
    padding: 0 2rem;
  }
  .quiz-config h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent3);
    margin-bottom: 0.35rem;
    letter-spacing: -0.02em;
  }
  .quiz-config .quiz-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }
  .config-section {
    margin-bottom: 1.75rem;
  }
  .config-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .config-tag-groups { display: flex; flex-direction: column; gap: 0.5rem; }
  .config-tag-row { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
  .config-tag-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    min-width: 70px;
    opacity: 0.6;
  }
  .quiz-tag-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 0.28rem 0.65rem;
    border-radius: 4px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .quiz-tag-btn:hover { border-color: var(--accent3); color: var(--text); }
  .quiz-tag-btn.selected { background: #f0a05b22; border-color: var(--accent3); color: var(--accent3); font-weight: 600; }
  .quiz-tag-btn.select-all { border-color: var(--accent); color: var(--accent); background: #5b6af011; }
  .quiz-tag-btn.select-all:hover { background: #5b6af033; }

  .question-count-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .count-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.4rem 0.9rem;
    border-radius: 5px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .count-btn:hover { border-color: var(--accent3); color: var(--text); }
  .count-btn.selected { background: #f0a05b22; border-color: var(--accent3); color: var(--accent3); font-weight: 700; }
  .count-custom {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.38rem 0.7rem;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 70px;
    outline: none;
  }
  .count-custom:focus { border-color: var(--accent3); }

  .quiz-available-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.6rem;
  }
  .quiz-available-info span { color: var(--accent2); font-weight: 600; }

  .start-quiz-btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 0.85rem 2.5rem;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent3), #e07020);
    border: none;
    color: #0d0f14;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    letter-spacing: 0.01em;
    margin-top: 0.5rem;
  }
  .start-quiz-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .start-quiz-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* === QUIZ ACTIVE === */
  .quiz-active {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
    display: none;
  }
  .quiz-active.visible { display: block; }

  .quiz-progress-bar-wrap {
    background: var(--surface);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), #e07020);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .quiz-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: space-between;
  }
  .quiz-q-num { color: var(--accent3); font-weight: 700; }
  .quiz-question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    animation: qFadeIn 0.25s ease;
  }
  @keyframes qFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .quiz-q-text {
    font-family: 'Syne', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 1.25rem;
  }
  .quiz-q-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    margin-bottom: 1rem;
    opacity: 0.6;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 0.6rem; }
  .quiz-option {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    padding: 0.75rem 1rem;
    border-radius: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--accent3); background: #f0a05b11; }
  .quiz-option .opt-letter {
    font-weight: 700;
    color: var(--muted);
    min-width: 1.1rem;
    flex-shrink: 0;
  }
  .quiz-option.correct { background: #00d4aa18; border-color: var(--accent2); color: var(--accent2); }
  .quiz-option.correct .opt-letter { color: var(--accent2); }
  .quiz-option.wrong { background: #e05b8a18; border-color: var(--accent4); color: var(--accent4); }
  .quiz-option.wrong .opt-letter { color: var(--accent4); }
  .quiz-option.reveal { background: #00d4aa0a; border-color: #00d4aa44; color: #00d4aa88; }
  .quiz-option:disabled { cursor: default; }

  .quiz-explanation {
    background: var(--surface2);
    border: 1px solid #5b6af033;
    border-radius: 8px;
    padding: 0.85rem 1rem;
    margin-top: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.77rem;
    color: var(--text);
    line-height: 1.6;
    display: none;
  }
  .quiz-explanation.visible { display: block; }
  .quiz-explanation strong { color: var(--accent2); }

  .quiz-next-btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0.7rem 2rem;
    border-radius: 7px;
    background: var(--accent);
    border: none;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 1rem;
    display: none;
  }

const grid = document.getElementById('notesGrid');

function buildCard(note) {
  const card = document.createElement('div');
  card.className = 'note-card' + (note.rich ? ' rich' : '');
  card.dataset.tags = note.tags.join(' ');
  card.dataset.search = (note.title + ' ' + note.body + ' ' + note.tags.join(' ')).toLowerCase();

  const title = document.createElement('div');
  title.className = 'note-title';
  title.textContent = note.title;
  if (note.rich) {
    const badge = document.createElement('span');
    badge.className = 'rich-badge';
    badge.textContent = 'LISTA';
    title.appendChild(badge);
  }

  const body = document.createElement('div');
  body.className = 'note-body';
  body.textContent = note.body;

  const tagRow = document.createElement('div');
  tagRow.className = 'note-tags';
  note.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'note-tag';
    span.dataset.tag = t;
    span.textContent = t;
    span.addEventListener('click', () => activateTag(t));
    tagRow.appendChild(span);
  });

  card.appendChild(title);
  card.appendChild(body);
  card.appendChild(tagRow);

  // Open modal on card click (but not when clicking a tag)
  card.addEventListener('click', (e) => {
    if (e.target.closest('.note-tag')) return;
    openNoteModal(note);
  });

  return card;
}

// === STATE ===
let activeTag = null;
let searchQuery = '';

function activateTag(tag) {
  activeTag = (activeTag === tag) ? null : tag;
  document.querySelectorAll('.tag-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tag === activeTag);
  });
  applyFilters();
  hideAutocomplete();
  document.getElementById('searchInput').value = '';
  searchQuery = '';
}

function applyFilters() {
  const q = searchQuery.trim().toLowerCase();
  let visible = 0;
  cards.forEach(({ card, note }) => {
    const matchTag = !activeTag || note.tags.includes(activeTag);
    const matchSearch = !q || card.dataset.search.includes(q);
    if (matchTag && matchSearch) {
      card.classList.remove('hidden');
      visible++;
      highlightCard(card, note, q);
    } else {
      card.classList.add('hidden');
    }
  });
  noResults.style.display = visible === 0 ? 'block' : 'none';
  const info = document.getElementById('resultsInfo');
  const total = cards.length;
  if (q || activeTag) {
    info.textContent = `Pokazuję ${visible} z ${total} notatek${activeTag ? ' · filtr: ' + activeTag : ''}`;
  } else {
    info.textContent = `${total} notatek łącznie`;
  }
}

function highlightCard(card, note, q) {
  const titleEl = card.querySelector('.note-title');
  const bodyEl = card.querySelector('.note-body');
  if (!q) {
    // Restore (with badge if rich)
    titleEl.textContent = note.title;
    if (note.rich) {
      const badge = document.createElement('span');
      badge.className = 'rich-badge';
      badge.textContent = 'LISTA';
      titleEl.appendChild(badge);
    }
    bodyEl.textContent = note.body;
    return;
  }
  const hl = s => highlight(escapeHtml(s), q);
  titleEl.innerHTML = hl(note.title) + (note.rich ? '<span class="rich-badge">LISTA</span>' : '');
  bodyEl.innerHTML = hl(note.body);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

// === AUTOCOMPLETE ===
const acEl = document.getElementById('autocomplete');
let acFocused = -1;
let acItems = [];

function showAutocomplete(q) {
  if (!q || q.length < 1) { hideAutocomplete(); return; }
  const ql = q.toLowerCase();
  // Match tags
  const matchedTags = allTags.filter(t => t.toLowerCase().includes(ql));
  // Match note titles
  const matchedNotes = NOTES.filter(n => n.title.toLowerCase().includes(ql)).slice(0, 3);

  acItems = [];
  const items = [];

  matchedTags.slice(0, 6).forEach(tag => {
    const count = NOTES.filter(n => n.tags.includes(tag)).length;
    acItems.push({ type: 'tag', value: tag });
    items.push({ type: 'tag', value: tag, count });
  });

  if (items.length === 0) {
    hideAutocomplete(); return;
  }

  acEl.innerHTML = '';
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'ac-item';
    div.dataset.idx = i;
    const badge = document.createElement('span');
    badge.className = 'ac-badge';
    badge.textContent = item.type === 'tag' ? `tag · ${item.count}` : 'notatka';
    const label = document.createElement('span');
    label.innerHTML = highlight(escapeHtml(item.value), ql);
    div.appendChild(badge);
    div.appendChild(label);
    div.addEventListener('mousedown', e => {
      e.preventDefault();
      if (item.type === 'tag') activateTag(item.value);
    });
    acEl.appendChild(div);
  });
  acFocused = -1;
  acEl.style.display = 'block';
}

function hideAutocomplete() {
  acEl.style.display = 'none';
  acFocused = -1;
}

function moveFocus(dir) {
  const items = acEl.querySelectorAll('.ac-item');
  if (!items.length) return;
  items[acFocused]?.classList.remove('focused');
  acFocused = Math.max(-1, Math.min(items.length - 1, acFocused + dir));
  items[acFocused]?.classList.add('focused');
}

// === EVENT LISTENERS ===
const searchInput = document.getElementById('searchInput');

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value;
  applyFilters();
  showAutocomplete(searchQuery);
});

searchInput.addEventListener('keydown', e => {
  if (acEl.style.display === 'block') {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const focused = acEl.querySelector('.ac-item.focused');
      if (focused) focused.dispatchEvent(new Event('mousedown'));
      else hideAutocomplete();
    }
    else if (e.key === 'Escape') hideAutocomplete();
  }
});

searchInput.addEventListener('blur', () => setTimeout(hideAutocomplete, 150));
searchInput.addEventListener('focus', () => { if (searchQuery) showAutocomplete(searchQuery); });

tagsGroupsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tag-filter');
  if (!btn) return;
  if (btn.dataset.tag === '__clear__') {
    activeTag = null;
    document.querySelectorAll('.tag-filter').forEach(b => b.classList.remove('active'));
    applyFilters();
    return;
  }
  activateTag(btn.dataset.tag);
});

// --- STATE ---
let quizSelectedTags = new Set();
let quizQuestionCount = 10;
let quizQuestions = [];
let quizCurrentIdx = 0;
let quizAnswers = []; // {selected: idx, correct: bool}
let quizCorrectCount = 0;

// --- CONFIG SCREEN ---
function renderQuizConfig() {
  const wrap = document.getElementById('quizTagGroups');
  wrap.innerHTML = '';

  // All tags button
  const allRow = document.createElement('div');
  allRow.className = 'config-tag-row';
  const allBtn = document.createElement('button');
  allBtn.className = 'quiz-tag-btn select-all';
  allBtn.textContent = '★ Wszystkie tematy';
  allBtn.onclick = () => {
    const allTagSet = new Set(QUESTION_BANK.flatMap(q => q.tags));
    if (quizSelectedTags.size === allTagSet.size) {
      quizSelectedTags.clear();
    } else {
      allTagSet.forEach(t => quizSelectedTags.add(t));
    }
    renderQuizConfig();
  };
  allRow.appendChild(allBtn);
  wrap.appendChild(allRow);

  TAG_GROUPS.forEach(group => {
    const row = document.createElement('div');
    row.className = 'config-tag-row';
    const label = document.createElement('span');
    label.className = 'config-tag-label';
    label.textContent = group.label;
    row.appendChild(label);
    group.tags.forEach(tag => {
      const available = QUESTION_BANK.some(q => q.tags.includes(tag));
      if (!available) return;
      const btn = document.createElement('button');
      btn.className = 'quiz-tag-btn' + (quizSelectedTags.has(tag) ? ' selected' : '');
      btn.textContent = tag;
      btn.onclick = () => {
        if (quizSelectedTags.has(tag)) quizSelectedTags.delete(tag);
        else quizSelectedTags.add(tag);
        renderQuizConfig();
      };
      row.appendChild(btn);
    });
    if (row.children.length > 1) wrap.appendChild(row);
  });

  updateAvailableInfo();
}

function updateAvailableInfo() {
  const pool = getQuestionPool();
  const info = document.getElementById('quizAvailableInfo');
  const btn = document.getElementById('startQuizBtn');
  const count = Math.min(quizQuestionCount, pool.length);
  if (quizSelectedTags.size === 0) {
    info.innerHTML = 'Wybierz co najmniej jeden tag.';
    btn.disabled = true;
  } else if (pool.length === 0) {
    info.innerHTML = 'Brak pytań dla wybranych tagów.';
    btn.disabled = true;
  } else {
    info.innerHTML = `Dostępnych pytań: <span>${pool.length}</span> — zostanie zadanych: <span>${count}</span>`;
    btn.disabled = false;
  }
}

function getQuestionPool() {
  if (quizSelectedTags.size === 0) return [];
  return QUESTION_BANK.filter(q => q.tags.some(t => quizSelectedTags.has(t)));
}

function selectCount(n, btn) {
  quizQuestionCount = n || 10;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.toggle('selected', parseInt(b.dataset.count) === n));
  updateAvailableInfo();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = getQuestionPool();
  const count = Math.min(quizQuestionCount, pool.length);
  quizQuestions = shuffle(pool).slice(0, count).map(q => ({
    ...q,
    options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i })))
  }));
  quizCurrentIdx = 0;
  quizAnswers = [];
  quizCorrectCount = 0;

  document.getElementById('quizConfigScreen').style.display = 'none';
  document.getElementById('quizActiveScreen').classList.add('visible');
  document.getElementById('quizResultsScreen').classList.remove('visible');
  document.getElementById('quizQTotal').textContent = quizQuestions.length;

  renderQuestion();
}

function renderQuestion() {
  const q = quizQuestions[quizCurrentIdx];
  const total = quizQuestions.length;

  document.getElementById('quizProgressBar').style.width = ((quizCurrentIdx / total) * 100) + '%';
  document.getElementById('quizQNum').textContent = quizCurrentIdx + 1;
  document.getElementById('quizScoreMeta').textContent = `Poprawne: ${quizCorrectCount}`;
  document.getElementById('quizQSource').textContent = '📝 ' + q.note;
  document.getElementById('quizQText').textContent = q.q;

  const optEl = document.getElementById('quizOptions');
  optEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}.</span><span>${opt.t}</span>`;
    btn.onclick = () => answerQuestion(i, q);
    optEl.appendChild(btn);
  });

  document.getElementById('quizExplanation').classList.remove('visible');
  document.getElementById('quizExplanation').innerHTML = '';
  document.getElementById('quizNextBtn').classList.remove('visible');

  // Animate
  const card = document.getElementById('quizQuestionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';
}

function answerQuestion(selectedIdx, q) {
  const optBtns = document.querySelectorAll('.quiz-option');
  optBtns.forEach(b => b.disabled = true);

  const correct = q.options[selectedIdx].c;
  quizAnswers.push({ selectedIdx, correct, q });
  if (correct) quizCorrectCount++;

  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    if (opt.c) optBtns[i].classList.add('correct');
    else if (i === selectedIdx && !opt.c) optBtns[i].classList.add('wrong');
    else optBtns[i].classList.add('reveal');
  });

  const expEl = document.getElementById('quizExplanation');
  const icon = correct ? '✅' : '❌';
  expEl.innerHTML = `<strong>${icon} ${correct ? 'Poprawnie!' : 'Błędna odpowiedź.'}</strong><br>${q.exp}`;
  expEl.classList.add('visible');

  document.getElementById('quizScoreMeta').textContent = `Poprawne: ${quizCorrectCount}`;

  const nextBtn = document.getElementById('quizNextBtn');
  nextBtn.classList.add('visible');
  const isLast = quizCurrentIdx === quizQuestions.length - 1;
  nextBtn.textContent = isLast ? 'Zobacz wyniki →' : 'Następne pytanie →';
}

function nextQuestion() {
  quizCurrentIdx++;
  if (quizCurrentIdx >= quizQuestions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quizActiveScreen').classList.remove('visible');
  const res = document.getElementById('quizResultsScreen');
  res.classList.add('visible');

  const total = quizQuestions.length;
  const pct = Math.round((quizCorrectCount / total) * 100);

  // Score color
  const color = pct >= 80 ? 'var(--accent2)' : pct >= 50 ? 'var(--accent3)' : 'var(--accent4)';
  document.getElementById('resultsScoreBig').style.color = color;
  document.getElementById('resultsScoreBig').textContent = `${quizCorrectCount}/${total}`;
  document.getElementById('resultsLabel').textContent = `${pct}% poprawnych odpowiedzi`;
  const stars = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : pct >= 40 ? '⭐' : '💀';
  document.getElementById('resultsStars').textContent = stars;

  const list = document.getElementById('resultsDetailList');
  list.innerHTML = '';
  const letters = ['A','B','C','D'];
  quizAnswers.forEach((ans, i) => {
    const q = ans.q;
    const div = document.createElement('div');
    div.className = 'result-item ' + (ans.correct ? 'result-correct' : 'result-wrong');

    const correctOpt = q.options.find(o => o.c);
    const selectedOpt = q.options[ans.selectedIdx];

    div.innerHTML = `
      <div class="result-q">${i+1}. ${q.q}</div>
      <div class="result-answer-row">
        ${ans.correct
          ? `<span class="result-your ok">✓ ${selectedOpt.t}</span>`
          : `<span class="result-your">✗ Twoja odpowiedź: ${selectedOpt.t}</span><br><span class="result-correct-ans">✓ Poprawna: ${correctOpt.t}</span>`
        }
      </div>
      <div class="result-source">📝 ${q.note}</div>
    `;
    list.appendChild(div);
  });
}

function restartQuiz() {
  quizCurrentIdx = 0;
  quizAnswers = [];
  quizCorrectCount = 0;
  quizQuestions = shuffle(quizQuestions).map(q => ({
    ...q,
    options: shuffle(q.options)
  }));
  document.getElementById('quizResultsScreen').classList.remove('visible');
  document.getElementById('quizActiveScreen').classList.add('visible');
  renderQuestion();
}

function newQuiz() {
  document.getElementById('quizResultsScreen').classList.remove('visible');
  document.getElementById('quizActiveScreen').classList.remove('visible');
  document.getElementById('quizConfigScreen').style.display = '';
  quizSelectedTags.clear();
  renderQuizConfig();
}
</script>
</body>
</html>
