<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INF02 – Notatki Egzaminacyjne</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #2a2f45;
    --accent: #5b6af0;
    --accent2: #00d4aa;
    --accent3: #f0a05b;
    --accent4: #e05b8a;
    --text: #e2e6f3;
    --muted: #7a84a8;
    --highlight: #5b6af022;
    --tag-bg: #1e2540;
    --tag-border: #2d3660;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* === HEADER === */
  header {
    padding: 2rem 2rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0a0c12 0%, var(--bg) 100%);
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
  }

  /* === SEARCH + AUTOCOMPLETE === */
  .search-wrapper {
    position: relative;
    margin-bottom: 1.1rem;
    max-width: 640px;
  }

  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1rem;
    pointer-events: none;
    z-index: 1;
  }

  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--highlight);
  }

  #searchInput::placeholder { color: var(--muted); }

  /* Autocomplete dropdown */
  #autocomplete {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: #1a1f30;
    border: 1px solid var(--accent);
    border-radius: 8px;
    overflow: hidden;
    z-index: 100;
    box-shadow: 0 8px 24px #00000066;
    display: none;
  }

  .ac-item {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    padding: 0.55rem 1rem;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    transition: background 0.1s;
  }

  .ac-item:hover, .ac-item.focused {
    background: var(--highlight);
    color: var(--accent);
  }

  .ac-item .ac-badge {
    font-size: 0.6rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    flex-shrink: 0;
  }

  .ac-item mark {
    background: transparent;
    color: var(--accent3);
    font-weight: 700;
    padding: 0;
  }

  /* === TAGS BAR === */
  .tags-section {
    margin-top: 0.5rem;
  }

  .tags-groups {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .tag-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
  }

  .tag-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    min-width: 70px;
    opacity: 0.6;
  }

  .tag-filter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 0.28rem 0.6rem;
    border-radius: 4px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    line-height: 1;
  }

  .tag-filter:hover { border-color: var(--accent); color: var(--text); }

  .tag-filter.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* Special exam tags */
  .tag-filter[data-tag="egzamin-teoretyczny"] { border-color: #3a7bd5; color: #7ab3f5; }
  .tag-filter[data-tag="egzamin-praktyczny"]  { border-color: #2ea87e; color: #5dd4ad; }
  .tag-filter[data-tag="egzamin-teoretyczny"].active { background: #3a7bd5; border-color: #3a7bd5; color: #fff; }
  .tag-filter[data-tag="egzamin-praktyczny"].active  { background: #2ea87e; border-color: #2ea87e; color: #fff; }

  .tag-filter.clear-btn {
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }

  .tag-filter.clear-btn:hover { border-color: #e05b5b; color: #e05b5b; }

  /* === LAYOUT === */
  .main { padding: 1.5rem 2rem; }

  .results-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
    min-height: 1rem;
  }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }

  /* === NOTE CARD === */
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .note-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 10px 0 0 10px;
  }

  .note-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .note-card:hover::before { opacity: 1; }
  .note-card.hidden { display: none; }

  /* === RICH card (has versions/lists) === */
  .note-card.rich {
    border-color: #2a3050;
    background: #161b28;
  }

  .note-card.rich::before { background: var(--accent3); }
  .note-card.rich:hover { border-color: var(--accent3); }
  .note-card.rich:hover::before { opacity: 1; }

  .note-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }

  .note-card.rich .note-title {
    color: var(--accent3);
  }

  .note-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* === NOTE TAGS (on card) === */
  .note-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.85rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border);
  }

  .note-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    padding: 0.18rem 0.45rem;
    border-radius: 3px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .note-tag:hover { border-color: var(--accent); color: var(--accent); }

  /* Exam tags on card */
  .note-tag[data-tag="egzamin-teoretyczny"] {
    border-color: #2a4a7a;
    color: #5a9ad5;
    background: #0e1826;
  }
  .note-tag[data-tag="egzamin-praktyczny"] {
    border-color: #1a5a42;
    color: #3dbd8e;
    background: #0a1e18;
  }
  /* Protocol tag */
  .note-tag[data-tag="protokół"] {
    border-color: #4a2d6a;
    color: #b07de0;
    background: #18102a;
  }

  /* Rich-card icon badge */
  .rich-badge {
    display: inline-block;
    font-size: 0.55rem;
    font-family: 'JetBrains Mono', monospace;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    background: #f0a05b22;
    border: 1px solid #f0a05b55;
    color: var(--accent3);
    margin-left: 0.5rem;
    vertical-align: middle;
    letter-spacing: 0.05em;
  }

  /* Highlight match */
  mark {
    background: #f0a05b33;
    color: var(--accent3);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* No results */
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    display: none;
  }

  @media (max-width: 600px) {
    header { padding: 1.25rem 1rem 1rem; }
    .main { padding: 1rem; }
    h1 { font-size: 1.5rem; }
    .notes-grid { grid-template-columns: 1fr; }
    .tag-group-label { display: none; }
  }
</style>
</head>

// === TAG GROUPS CONFIG ===
const TAG_GROUPS = [
  { label: "Egzamin", tags: ["egzamin-teoretyczny","egzamin-praktyczny"] },
  { label: "Komendy", tags: ["komenda-linux","komenda-windows"] },
  { label: "Sieć", tags: ["sieć","protokół","WiFi","VPN","ISO-OSI","adresacja-IP","DNS","IEEE","standardy","topologia","LAN","bezprzewodowe","VoIP","transmisja"] },
  { label: "Hardware", tags: ["hardware","CPU","pamięć","dyski","karta-graficzna","interfejsy","przepustowości","rozdzielczości","okablowanie","światłowód","zasilanie","audio","drukarki","skanery"] },
  { label: "System", tags: ["linux","windows","system-operacyjny","system-plików","active-directory","rejestr","użytkownicy","konfiguracja","serwery","www","FTP","backup"] },
  { label: "Inne", tags: ["normy","licencje","bezpieczeństwo","BHP","diagnostyka","narzędzia","oprogramowanie","historia","poczta"] },
];

// Flatten for autocomplete
const allTags = [...new Set(NOTES.flatMap(n => n.tags))].sort();

// === BUILD TAG GROUPS ===
const tagsGroupsEl = document.getElementById('tagsGroups');

// Clear button row
const clearRow = document.createElement('div');
clearRow.className = 'tag-group';
const clearLabel = document.createElement('span');
clearLabel.className = 'tag-group-label';
clearLabel.textContent = '';
const clearBtn = document.createElement('span');
clearBtn.className = 'tag-filter clear-btn';
clearBtn.dataset.tag = '__clear__';
clearBtn.textContent = '✕ wyczyść filtry';
clearRow.appendChild(clearLabel);
clearRow.appendChild(clearBtn);
tagsGroupsEl.appendChild(clearRow);

TAG_GROUPS.forEach(group => {
  const existing = group.tags.filter(t => allTags.includes(t));
  if (!existing.length) return;
  const row = document.createElement('div');
  row.className = 'tag-group';
  const label = document.createElement('span');
  label.className = 'tag-group-label';
  label.textContent = group.label;
  row.appendChild(label);
  existing.forEach(tag => {
    const btn = document.createElement('span');
    btn.className = 'tag-filter';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    row.appendChild(btn);
  });
  tagsGroupsEl.appendChild(row);
});

// === BUILD NOTE CARDS ===
const grid = document.getElementById('notesGrid');
const noResults = document.getElementById('noResults');

function buildCard(note) {
  const card = document.createElement('div');
  card.className = 'note-card' + (note.rich ? ' rich' : '');
  card.dataset.tags = note.tags.join(' ');
  card.dataset.search = (note.title + ' ' + note.body + ' ' + note.tags.join(' ')).toLowerCase();

  const title = document.createElement('div');
  title.className = 'note-title';
  title.textContent = note.title;
  if (note.rich) {
    const badge = document.createElement('span');
    badge.className = 'rich-badge';
    badge.textContent = 'LISTA';
    title.appendChild(badge);
  }

  const body = document.createElement('div');
  body.className = 'note-body';
  body.textContent = note.body;

  const tagRow = document.createElement('div');
  tagRow.className = 'note-tags';
  note.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'note-tag';
    span.dataset.tag = t;
    span.textContent = t;
    span.addEventListener('click', () => activateTag(t));
    tagRow.appendChild(span);
  });

  card.appendChild(title);
  card.appendChild(body);
  card.appendChild(tagRow);
  return card;
}

const cards = NOTES.map(note => {
  const card = buildCard(note);
  grid.insertBefore(card, noResults);
  return { card, note };
});

// === STATE ===
let activeTag = null;
let searchQuery = '';

function activateTag(tag) {
  activeTag = (activeTag === tag) ? null : tag;
  document.querySelectorAll('.tag-filter').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tag === activeTag);
  });
  applyFilters();
  hideAutocomplete();
  document.getElementById('searchInput').value = '';
  searchQuery = '';
}

function applyFilters() {
  const q = searchQuery.trim().toLowerCase();
  let visible = 0;
  cards.forEach(({ card, note }) => {
    const matchTag = !activeTag || note.tags.includes(activeTag);
    const matchSearch = !q || card.dataset.search.includes(q);
    if (matchTag && matchSearch) {
      card.classList.remove('hidden');
      visible++;
      highlightCard(card, note, q);
    } else {
      card.classList.add('hidden');
    }
  });
  noResults.style.display = visible === 0 ? 'block' : 'none';
  const info = document.getElementById('resultsInfo');
  const total = cards.length;
  if (q || activeTag) {
    info.textContent = `Pokazuję ${visible} z ${total} notatek${activeTag ? ' · filtr: ' + activeTag : ''}`;
  } else {
    info.textContent = `${total} notatek łącznie`;
  }
}

function highlightCard(card, note, q) {
  const titleEl = card.querySelector('.note-title');
  const bodyEl = card.querySelector('.note-body');
  if (!q) {
    // Restore (with badge if rich)
    titleEl.textContent = note.title;
    if (note.rich) {
      const badge = document.createElement('span');
      badge.className = 'rich-badge';
      badge.textContent = 'LISTA';
      titleEl.appendChild(badge);
    }
    bodyEl.textContent = note.body;
    return;
  }
  const hl = s => highlight(escapeHtml(s), q);
  titleEl.innerHTML = hl(note.title) + (note.rich ? '<span class="rich-badge">LISTA</span>' : '');
  bodyEl.innerHTML = hl(note.body);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
}

// === AUTOCOMPLETE ===
const acEl = document.getElementById('autocomplete');
let acFocused = -1;
let acItems = [];

function showAutocomplete(q) {
  if (!q || q.length < 1) { hideAutocomplete(); return; }
  const ql = q.toLowerCase();
  // Match tags
  const matchedTags = allTags.filter(t => t.toLowerCase().includes(ql));
  // Match note titles
  const matchedNotes = NOTES.filter(n => n.title.toLowerCase().includes(ql)).slice(0, 3);

  acItems = [];
  const items = [];

  matchedTags.slice(0, 6).forEach(tag => {
    const count = NOTES.filter(n => n.tags.includes(tag)).length;
    acItems.push({ type: 'tag', value: tag });
    items.push({ type: 'tag', value: tag, count });
  });

  if (items.length === 0) {
    hideAutocomplete(); return;
  }

  acEl.innerHTML = '';
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'ac-item';
    div.dataset.idx = i;
    const badge = document.createElement('span');
    badge.className = 'ac-badge';
    badge.textContent = item.type === 'tag' ? `tag · ${item.count}` : 'notatka';
    const label = document.createElement('span');
    label.innerHTML = highlight(escapeHtml(item.value), ql);
    div.appendChild(badge);
    div.appendChild(label);
    div.addEventListener('mousedown', e => {
      e.preventDefault();
      if (item.type === 'tag') activateTag(item.value);
    });
    acEl.appendChild(div);
  });
  acFocused = -1;
  acEl.style.display = 'block';
}

function hideAutocomplete() {
  acEl.style.display = 'none';
  acFocused = -1;
}

function moveFocus(dir) {
  const items = acEl.querySelectorAll('.ac-item');
  if (!items.length) return;
  items[acFocused]?.classList.remove('focused');
  acFocused = Math.max(-1, Math.min(items.length - 1, acFocused + dir));
  items[acFocused]?.classList.add('focused');
}

// === EVENT LISTENERS ===
const searchInput = document.getElementById('searchInput');

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value;
  applyFilters();
  showAutocomplete(searchQuery);
});

searchInput.addEventListener('keydown', e => {
  if (acEl.style.display === 'block') {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const focused = acEl.querySelector('.ac-item.focused');
      if (focused) focused.dispatchEvent(new Event('mousedown'));
      else hideAutocomplete();
    }
    else if (e.key === 'Escape') hideAutocomplete();
  }
});

searchInput.addEventListener('blur', () => setTimeout(hideAutocomplete, 150));
searchInput.addEventListener('focus', () => { if (searchQuery) showAutocomplete(searchQuery); });

tagsGroupsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tag-filter');
  if (!btn) return;
  if (btn.dataset.tag === '__clear__') {
    activeTag = null;
    document.querySelectorAll('.tag-filter').forEach(b => b.classList.remove('active'));
    applyFilters();
    return;
  }
  activateTag(btn.dataset.tag);
});

// === INIT ===
applyFilters();
</script>
